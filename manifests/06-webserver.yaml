apiVersion: v1
kind: Service
metadata:
  name: airflow-webserver
  namespace: airflow-argocd
spec:
  selector:
    app: airflow-webserver
  ports:
    - port: 9090
      targetPort: 8080
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: airflow-webserver
  namespace: airflow-argocd
spec:
  ingressClassName: nginx
  rules:
    - host: airflow-argocd.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: airflow-webserver
                port:
                  number: 9090
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: airflow-webserver
  namespace: airflow-argocd
spec:
  replicas: 1
  selector:
    matchLabels:
      app: airflow-webserver
  template:
    metadata:
      labels:
        app: airflow-webserver
    spec:
      securityContext:
        fsGroup: 50000
      initContainers:
        - name: git-sync-init
          image: registry.k8s.io/git-sync/git-sync:v4.2.4
          env:
            - name: GITSYNC_REPO
              value: https://gitlab.allence.cloud/clients-acp/photoevent/build/others/airflow.git
            - name: GITSYNC_REF
              value: main
            - name: GITSYNC_ROOT
              value: /opt/airflow/dags-source
            - name: GITSYNC_LINK
              value: current
            - name: GITSYNC_ONE_TIME
              value: "true"
            - name: GITSYNC_USERNAME
              valueFrom:
                secretKeyRef:
                  name: gitlab-credentials
                  key: username
            - name: GITSYNC_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: gitlab-credentials
                  key: token
          volumeMounts:
            - name: dags
              mountPath: /opt/airflow/dags-source
      containers:
        - name: git-sync
          image: registry.k8s.io/git-sync/git-sync:v4.2.4
          env:
            - name: GITSYNC_REPO
              value: https://gitlab.allence.cloud/clients-acp/photoevent/build/others/airflow.git
            - name: GITSYNC_REF
              value: main
            - name: GITSYNC_ROOT
              value: /opt/airflow/dags-source
            - name: GITSYNC_LINK
              value: current
            - name: GITSYNC_PERIOD
              value: 30s
            - name: GITSYNC_USERNAME
              valueFrom:
                secretKeyRef:
                  name: gitlab-credentials
                  key: username
            - name: GITSYNC_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: gitlab-credentials
                  key: token
          volumeMounts:
            - name: dags
              mountPath: /opt/airflow/dags-source
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
        - name: webserver
          image: airflow-photoevent:1.1
          imagePullPolicy: IfNotPresent
          command: ["/bin/bash", "-c"]
          args: ["airflow api-server"]
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: AIRFLOW_HOME
              value: /opt/airflow
            - name: AIRFLOW_CONFIG
              value: /opt/airflow/airflow.cfg
          volumeMounts:
            - name: config
              mountPath: /opt/airflow/airflow.cfg
              subPath: airflow.cfg
            - name: dags
              mountPath: /opt/airflow/dags-source
              readOnly: true
          readinessProbe:
            httpGet:
              path: /api/v2/monitor/health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/v2/monitor/health
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1Gi
      volumes:
        - name: config
          configMap:
            name: airflow-config
        - name: dags
          emptyDir: {}
